name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build + runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libgl1-mesa-dev libegl1-mesa-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad ffmpeg pipewire

      - name: Build + unit tests (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release
          cargo test

      - name: Full suite (Linux: build, tests, synthetic encode, pipelines)
        if: runner.os == 'Linux'
        run: ./test.sh