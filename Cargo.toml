[package]
name = "glass"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Glass - a tiny, beautiful screen recorder. Native Rust orchestrator, full resolution + monitor refresh rate."
license = "MIT"
repository = "https://github.com/Celine1337/glass"
readme = "README.md"
keywords = ["screen-recorder", "wayland", "pipewire", "gstreamer", "egui"]
categories = ["multimedia::video", "gui"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.31"
display-info = "0.5"
dirs = "7"

[target.'cfg(unix)'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast"] }
tokio = { version = "1", features = ["rt", "macros", "sync"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1